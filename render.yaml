services:
  - type: web
    runtime: node
    name: us-navy-pos
    branch: main
    buildCommand: npm ci --include=dev --ignore-scripts && npm rebuild better-sqlite3 --build-from-source && npm run build:frontend && npm run build
    startCommand: node dev-server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FLO_DEV_USER_DATA
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: FLO_ALLOWED_ORIGINS
        sync: false
    disk:
      name: flo-data
      mountPath: /data
